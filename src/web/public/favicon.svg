<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Balance beam -->
  <line x1="8" y1="22" x2="56" y2="22" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fulcrum / stand -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="48" x2="40" y2="48" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left pan (lighter = less bias) -->
  <path d="M12 22 Q8 28 10 34 L22 34 Q24 28 20 22" fill="#1e293b" opacity="0.6"/>
  <line x1="12" y1="22" x2="20" y2="22" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Right pan (heavier = more bias, tipped down) -->
  <path d="M44 22 Q40 28 42 34 L54 34 Q56 28 52 22" fill="#f59e0b" opacity="0.9"/>
  <line x1="44" y1="22" x2="52" y2="22" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Right pan is tipped lower — heavy with bias -->
  <circle cx="48" cy="38" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="48" cy="43" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="48" cy="48" r="3" fill="#f59e0b" opacity="0.4"/>
  <!-- Subtle glow around the right side (bias detected) -->
  <circle cx="48" cy="40" r="18" fill="#f59e0b" opacity="0.08"/>
</svg>
